services:
  - type: web
    name: joy-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ORGANISER_SECRET
        value: nextwave2026
      - key: INDIC_F5_TTS_URL
        value: ""
      - key: OPENVOICE_URL
        value: ""
